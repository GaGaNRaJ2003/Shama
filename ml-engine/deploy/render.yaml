# Render Blueprint — Shama ML Engine
# Free tier: 750 hrs/month, 512MB RAM, auto-sleep after 15min inactivity
# Deploy: Connect GitHub repo -> Render will auto-detect this file

services:
  - type: web
    name: shama-ml-engine
    runtime: python
    plan: free
    region: oregon
    repo: https://github.com/YOUR_USERNAME/Shama
    branch: main
    rootDir: ml-engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn ml-engine.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info
      - key: CACHE_TTL_SECONDS
        value: "86400"
      - key: MAX_CONCURRENT_REQUESTS
        value: "10"
      - key: TORCH_CPU_ONLY
        value: "1"
      - key: TRANSFORMERS_CACHE
        value: /opt/render/.cache/huggingface
